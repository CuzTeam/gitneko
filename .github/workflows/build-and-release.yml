name: Build and Release

on:
    push:
        branches:
            - main
        tags:
            - 'v*.*.*'
    pull_request:
        branches: ['*']
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
    workflow_dispatch:

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Calc tools versions
              id: tools-versions
              run: |
                  NODE_VERSION=$(jq -r '.engines.node | gsub("[^0-9.]"; "")' package.json)
                  PNPM_VERSION=$(jq -r '.packageManager | split("@")[1]' package.json)
                  echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT
                  echo "pnpm-version=$PNPM_VERSION" >> $GITHUB_OUTPUT

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ steps.tools-versions.outputs.node-version }}

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ steps.tools-versions.outputs.pnpm-version }}

            - name: Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run bundle

            - name: Setup Environment
              run: node -e "console.log('PACKAGE_VERSION=' + require('./package.json').version + '\nPACKAGE_NAME=' + require('./package.json').name + '-' + require('./package.json').version)" >> $GITHUB_ENV

            - name: Package extension
              if: github.ref_type == 'tag'
              run: pnpm run package

            - name: Upload extension artifact
              if: github.ref_type == 'tag'
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.PACKAGE_NAME }}.vsix
                  path: ./${{ env.PACKAGE_NAME }}.vsix

    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs: build
        if: github.ref_type == 'tag'
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Environment
              run: node -e "console.log('PACKAGE_VERSION=' + require('./package.json').version + '\nPACKAGE_NAME=' + require('./package.json').name + '-' + require('./package.json').version)" >> $GITHUB_ENV

            - name: Download extension artifact
              uses: actions/download-artifact@v4
              with:
                  name: ${{ env.PACKAGE_NAME }}.vsix

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ github.ref_name }}
                  name: v${{ env.PACKAGE_VERSION }}
                  draft: false
                  prerelease: false
                  files: ./${{ env.PACKAGE_NAME }}.vsix
